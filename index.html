</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="symbol">R</div><div><strong>Ruang HPP</strong><small>CAFE FINANCE</small></div></div><nav class="nav" id="desktopnav"></nav><div class="sidefoot">Pengelolaan biaya & profitabilitas kafe<br/>Data tersimpan di perangkat ini.</div></aside><div class="mobile-appbar"><div class="app-mark">R</div><div class="app-wordmark"><strong>Ruang HPP</strong><small>CAFE FINANCE · V6</small></div><span class="device-pill"><span class="device-dot"></span> Lokal</span></div><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow">OPERASIONAL KAFE</div><h1 id="title">Bahan & Persediaan</h1><p id="subtitle">Kelola seluruh bahan makanan dan minuman dalam satu tempat.</p></div><div id="headAction"></div></header><div id="mobileFab" class="mobile-fab-anchor"></div><div id="content"></div></main></div><nav class="mobile-nav" id="mobilenav" aria-label="Navigasi utama"></nav><div id="appToast" class="app-toast" role="status" aria-live="polite" hidden></div><div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script>
const KEY='ruanghpp.v1'; const fresh=()=>({ingredients:[],menus:[],sales:[],expenses:[],settings:{foodTarget:35,foodMin:28,foodMax:35,margin:70,waste:0,forecastPortions:1000,fixed:[{name:'Listrik',value:1500000},{name:'Air',value:450000},{name:'WiFi',value:375000},{name:'Gaji karyawan',value:18000000},{name:'Pengeluaran lain',value:30000}]}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}db={...fresh(),...db,settings:{...fresh().settings,...db.settings}};
// Pembaruan skema harga v4. Resep tetap ada; margin menu yang sebelumnya
// mengikuti nilai bawaan lama sekarang mengikuti target global 70%.
function migratePricing(d){
 if(d.settings.pricingVersion===4)return;
 const oldGlobal=Number(d.settings.margin??25);
 d.menus.forEach(m=>{
   m.marginCustom=Number(m.margin??oldGlobal)!==oldGlobal;
   if(!m.marginCustom)m.margin=70;
 });
 d.settings.foodMin=28;d.settings.foodMax=35;
 d.settings.foodTarget=35;d.settings.margin=70;
 d.settings.pricingVersion=4;
}
migratePricing(db);localStorage.setItem(KEY,JSON.stringify(db));
let tab='ingredients',reportMonth=new Date().toISOString().slice(0,7),reportView='overview',search='',editId=null;
const id=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2); const n=v=>Number(v)||0;const fmt=v=>'Rp '+Math.round(n(v)).toLocaleString('id-ID');const num=v=>n(v).toLocaleString('id-ID',{maximumFractionDigits:3});const pct=v=>n(v).toLocaleString('id-ID',{maximumFractionDigits:1})+'%';const datefmt=s=>new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(err){notify('Tidak bisa menyimpan di perangkat ini. Periksa izin penyimpanan browser.','error');console.error('Ruang HPP: gagal menyimpan',err);return false}};const fixed=()=>db.settings.fixed.reduce((a,x)=>a+n(x.value),0);const overhead=()=>fixed()/Math.max(1,n(db.settings.forecastPortions));const byid=(type,x)=>db[type].find(y=>y.id===x);const ingCost=i=>i&&n(i.packSize)>0?n(i.packPrice)/n(i.packSize):0;
// Metode menu costing: Food cost = bahan + waste; HPP variabel = food cost + biaya tambahan.
const calcMenu=m=>{
  const base=(m.items||[]).reduce((sum,r)=>sum+ingCost(byid('ingredients',r.ingredientId))*n(r.quantity),0);
  const waste=base*n(db.settings.waste)/100;
  const other=n(m.extraCost);
  const foodCost=base+waste;
  const hpp=foodCost+other;
  const minFC=n(db.settings.foodMin),maxFC=n(db.settings.foodMax);
  const margin=n(m.marginCustom===true?m.margin:db.settings.margin);
  // FC antara 28% dan 35% berarti biaya bahan / harga jual dalam rentang ini.
  // Margin kontribusi minimal 70% berarti HPP variabel / harga jual maksimal 30%.
  const pFood=foodCost>0&&maxFC>0?foodCost/(maxFC/100):0; // harga minimum: FC <=35%
  const pFoodUpper=foodCost>0&&minFC>0?foodCost/(minFC/100):0; // harga maksimum agar FC >=28%
  const pMargin=hpp>0&&margin<100?hpp/(1-margin/100):0;
  const exactPrice=Math.max(0,pFood,pMargin);
  const recommended=Math.ceil((exactPrice-1e-9)/500)*500;
  const actual=n(m.sellPrice)>0?n(m.sellPrice):recommended;
  const food=actual>0?100*foodCost/actual:0;
  const profit=actual-hpp;
  const profitPct=actual>0?100*profit/actual:0;
  const foodPass=actual>0&&food>=minFC-1e-9&&food<=maxFC+1e-9;
  const marginPass=actual>0&&profitPct+1e-9>=margin;
  const canMatch=foodCost>0&&exactPrice<=pFoodUpper+1e-9;
  const recommendInRange=recommended>0&&100*foodCost/recommended>=minFC-1e-9&&100*foodCost/recommended<=maxFC+1e-9;
  const status=actual<=0?'Belum dihitung':food<minFC-1e-9?'Food cost di bawah '+pct(minFC):food>maxFC+1e-9?'Food cost di atas '+pct(maxFC):!marginPass?'Margin kurang dari '+pct(margin):'Dua target tercapai';
  return {base,waste,other,foodCost,hpp,pFood,pFoodUpper,pMargin,recommended,actual,margin,food,profit,profitPct,
    minFC,maxFC,foodPass,pass:foodPass&&marginPass,marginPass,canMatch,recommendInRange,status};
};
const foodRange=()=>pct(db.settings.foodMin)+'–'+pct(db.settings.foodMax);
const statusClass=x=>x.pass?'ok':x.food<x.minFC?'warn':'bad';
const pricingNote=x=>!x.canMatch?'Target margin '+pct(x.margin)+' dan food cost '+foodRange()+' tidak bisa dicapai bersama dengan komposisi biaya ini. Periksa biaya kemasan/tambahan atau sesuaikan target.':!x.recommendInRange?'Pembulatan Rp500 membuat food cost rekomendasi keluar dari rentang '+foodRange()+'. Coba harga jual manual agar lebih tepat.':'Kedua target dapat dicapai pada harga rekomendasi.';

const paths=['<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 4v16M5 10h14"/></svg>','<svg viewBox="0 0 24 24"><path d="M4 6h16M6 6l1 14h10l1-14M9 10v7m6-7v7M8 3h8"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="5"/></svg>','<svg viewBox="0 0 24 24"><path d="M4 4v16h16M8 16l4-5 3 2 5-7"/></svg>'];const tabs=[['ingredients','Bahan'],['menus','Menu & HPP'],['settings','Pengaturan'],['reports','Laba Rugi']];const descriptions={ingredients:['Bahan & Persediaan','Kelola seluruh bahan makanan dan minuman dalam satu tempat.'],menus:['Menu & Kalkulasi HPP','Hitung biaya per porsi dan temukan harga jual yang tepat.'],settings:['Pengaturan Biaya','Tetapkan target biaya, asumsi, dan pengeluaran rutin bulanan.'],reports:['Laporan Keuangan','Pantau penjualan, pengeluaran dan keuntungan usaha.']};
function nav(){for(let mode of ['desktop','mobile'])document.getElementById(mode+'nav').innerHTML=tabs.map(([k,v],i)=>`<button class="${tab===k?(mode==='mobile'?'on':'active'):''}" onclick="go('${k}')">${paths[i]}<span>${v}</span></button>`).join('')}
function go(t){tab=t;search='';render();window.scrollTo(0,0)}function render(){nav();document.getElementById('title').textContent=descriptions[tab][0];document.getElementById('subtitle').textContent=descriptions[tab][1];document.getElementById('headAction').innerHTML=tab==='ingredients'?`<button class="button" onclick="ingredientModal()">+ Tambah Bahan</button>`:tab==='menus'?`<button class="button" onclick="menuModal()">+ Buat Menu</button>`:tab==='reports'?`<button class="button" onclick="salesModal()">+ Catat Penjualan</button>`:'';document.getElementById('content').innerHTML=(isPhone()?{ingredients:phoneIngredientPage,menus:phoneMenuPage,settings:phoneSettingsPage,reports:phoneReportPage}:{ingredients:ingredientPage,menus:menuPage,settings:settingsPage,reports:reportPage})[tab]();updateFab();}
const stat=(title,val,sub)=>`<div class="card"><div class="stat-label">${title}</div><div class="stat-value">${val}</div><div class="stat-sub">${sub}</div></div>`;
function ingredientPage(){let list=db.ingredients.filter(i=>[i.name,i.category].join(' ').toLowerCase().includes(search.toLowerCase()));return `<div class="stack"><div class="grid">${stat('Total bahan',db.ingredients.length,'Semua bahan aktif')}${stat('Bahan makanan',db.ingredients.filter(x=>x.category==='Makanan').length,'Termasuk bumbu & pelengkap')}${stat('Bahan minuman',db.ingredients.filter(x=>x.category==='Minuman').length,'Termasuk kopi & sirup')}</div><div class="card"><div class="sectionhead"><h2>Daftar bahan baku</h2><span class="tag">${db.ingredients.length} bahan</span></div><div class="toolbar"><input class="search" placeholder="Cari bahan..." value="${safe(search)}" oninput="search=this.value;refreshTable()" id="find"/><span class="muted" style="font-size:11px">Harga satuan dihitung otomatis dari isi kemasan.</span></div><div id="tableArea">${ingredientTable(list)}</div></div><div class="hint">Contoh: susu 1 liter seharga Rp 24.000 → biaya per ml = Rp 24. Bahan dalam gram dan ml dihitung terpisah sesuai satuan kemasan yang dimasukkan.</div></div>`}
function ingredientTable(list){return `<div class="tablewrap"><table><thead><tr><th>Bahan</th><th>Kategori</th><th>Ukuran kemasan</th><th>Harga kemasan</th><th>Biaya per satuan</th><th>Aksi</th></tr></thead><tbody>${list.map(i=>`<tr><td><strong>${safe(i.name)}</strong></td><td><span class="tag">${safe(i.category)}</span></td><td>${num(i.packSize)} ${i.unit}</td><td>${fmt(i.packPrice)}</td><td><strong>${fmt(ingCost(i))}/${i.unit}</strong></td><td><button class="mini" onclick="ingredientModal('${i.id}')">Edit</button><button class="mini clear" onclick="delIngredient('${i.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><strong>Belum ada bahan</strong>Tambahkan bahan untuk memulai perhitungan HPP.</div></td></tr>`}</tbody></table></div>`}
function refreshTable(){document.getElementById('tableArea').innerHTML=(isPhone()?phoneIngredientCards:ingredientTable)(db.ingredients.filter(i=>[i.name,i.category].join(' ').toLowerCase().includes(search.toLowerCase())))}
function menuPage(){return `<div class="stack"><div class="hero"><div><small>SIMULASI HARGA JUAL</small><strong>Harga berbasis biaya resep.</strong><p>Harga rekomendasi menargetkan food cost ${foodRange()} dan margin kontribusi minimal ${pct(db.settings.margin)}. Biaya operasional bulanan dievaluasi terpisah dalam laporan laba rugi.</p></div><button class="button" onclick="menuModal()">+ Hitung Menu Baru</button></div><div class="grid">${stat('Total menu',db.menus.length,'Resep yang telah dihitung')}${stat('Menu sesuai target',db.menus.filter(m=>calcMenu(m).pass).length,'FC '+foodRange()+' & margin sesuai')}${stat('Biaya tetap bulanan',fmt(fixed()),'Dianalisis terpisah pada laba rugi')}</div><div class="card"><div class="sectionhead"><h2>Analisis setiap menu</h2><small>Harga jual dan margin kontribusi</small></div><div class="tablewrap"><table><thead><tr><th>Menu</th><th>HPP per porsi</th><th>Harga jual</th><th>Food cost</th><th>Margin estimasi*</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.menus.map(m=>{let x=calcMenu(m);return `<tr><td><strong>${safe(m.name)}</strong><small>${safe(m.category)}</small></td><td>${fmt(x.hpp)}</td><td><strong>${fmt(x.actual)}</strong><small>Rekomendasi: ${fmt(x.recommended)}</small></td><td>${pct(x.food)}</td><td>${pct(x.profitPct)}<small>${fmt(x.profit)}/porsi</small></td><td><span class="tag ${statusClass(x)}">${x.pass?'Sesuai':safe(x.status)}</span></td><td><button class="mini" onclick="menuDetail('${m.id}')">Rincian</button><button class="mini" onclick="menuModal('${m.id}')">Edit</button><button class="mini clear" onclick="delMenu('${m.id}')">×</button></td></tr>`}).join('')||`<tr><td colspan="7"><div class="empty"><strong>Belum ada menu</strong>Tambah bahan dahulu, kemudian susun resep menu.</div></td></tr>`}</tbody></table></div></div><div class="card"><div class="sectionhead"><h2>Dasar perhitungan</h2><small>Rumus umum industri restoran</small></div><div class="hrow"><span>Food cost (%)</span><strong>(Biaya bahan + waste) ÷ harga jual × 100%</strong></div><div class="hrow"><span>Margin estimasi (%)</span><strong>(Harga jual − HPP variabel) ÷ harga jual × 100%</strong></div><div class="hrow"><span>Harga minimum dari food cost</span><strong>(Biaya bahan + waste) ÷ batas atas food cost (35% bawaan)</strong></div><div class="hrow"><span>Harga berdasarkan margin</span><strong>HPP variabel ÷ (1 − target margin)</strong></div><p class="muted" style="font-size:11px;line-height:1.7">Harga rekomendasi memilih harga minimum untuk margin dan batas atas food cost, lalu dibulatkan ke atas Rp500. Rentang 28–35% tidak selalu dapat dicapai bersama margin 70%, khususnya jika ada biaya kemasan. *Margin estimasi adalah margin kontribusi sebelum gaji, sewa, listrik, pajak dan biaya tetap lainnya; bukan laba bersih.</p></div></div>`}
function settingsPage(){return `<div class="stack"><div class="grid">${stat('Biaya tetap / bulan',fmt(fixed()),'Total seluruh pengeluaran tetap')}${stat('Rentang food cost',foodRange(),'Target untuk seluruh menu')}${stat('Simulasi overhead / porsi',fmt(overhead()),'Hanya informasi, tidak masuk ke harga menu')}</div><div class="grid two"><div class="card"><div class="sectionhead"><h2>Target & asumsi</h2></div><form onsubmit="saveSettings(event)" class="formgrid"><label>Food cost minimum (%)<input required type="number" min="0.1" max="99" step="0.1" name="foodMin" value="${db.settings.foodMin}"/></label><label>Food cost maksimum (%)<input required type="number" min="0.1" max="99" step="0.1" name="foodMax" value="${db.settings.foodMax}"/></label><label>Target margin kontribusi (%)<input required type="number" min="0" max="95" step="0.1" name="margin" value="${db.settings.margin}"/></label><label>Cadangan waste (%)<input required type="number" min="0" max="100" step="0.1" name="waste" value="${db.settings.waste}"/></label><label>Perkiraan porsi terjual / bulan<input required type="number" min="1" step="1" name="forecastPortions" value="${db.settings.forecastPortions}"/></label><div class="span2 hint">Margin 70% dan food cost 28–35% umumnya bertemu pada food cost sekitar 30% jika tidak ada biaya tambahan. Jika ada kemasan, kedua target belum tentu bisa dipenuhi sekaligus. Proyeksi porsi hanya untuk simulasi overhead dan tidak ditambahkan otomatis ke setiap harga menu.</div><button class="button span2" type="submit">Simpan pengaturan</button></form></div><div class="card"><div class="sectionhead"><h2>Pengeluaran tetap bulanan</h2><button class="button alt small" onclick="fixedModal()">+ Tambah</button></div>${db.settings.fixed.map((e,i)=>`<div class="hrow"><span>${safe(e.name)}</span><div class="flex"><strong>${fmt(e.value)}</strong><button class="mini" onclick="fixedModal(${i})">Edit</button><button class="mini clear" onclick="delFixed(${i})">×</button></div></div>`).joi function monthSales(){return db.sales.filter(s=>s.date.slice(0,7)===reportMonth)}function monthExpenses(){return db.expenses.filter(e=>e.date.slice(0,7)===reportMonth)}function financials(){let sales=monthSales(),extra=monthExpenses();let revenue=sales.reduce((a,s)=>a+n(s.price)*n(s.qty),0),cogs=sales.reduce((a,s)=>a+n(s.cost)*n(s.qty),0),foodCogs=sales.reduce((a,s)=>a+n(s.foodCost??s.cost)*n(s.qty),0),other=extra.reduce((a,e)=>a+n(e.amount),0),f=fixed(),gross=revenue-cogs,net=gross-f-other;return {sales,extra,revenue,cogs,foodCogs,other,f,gross,net,qty:sales.reduce((a,s)=>a+n(s.qty),0)}}
function reportPage(){let x=financials();return `<div class="stack"><div class="toolbar no-print"><label>Bulan laporan<input type="month" value="${reportMonth}" onchange="reportMonth=this.value;render()" /></label><button class="button alt" onclick="expenseModal()">+ Pengeluaran lain</button><button class="button ghost" onclick="window.print()">Cetak laporan</button><button class="button alt" onclick="exportReportCSV()">Unduh CSV</button></div><div class="tabline no-print">${[['overview','Ringkasan'],['sales','Penjualan'],['expenses','Pengeluaran']].map(([k,v])=>`<button class="${reportView===k?'on':''}" onclick="reportView='${k}';render()">${v}</button>`).join('')}</div>${reportView==='overview'?`<div class="grid">${stat('Omzet tercatat',fmt(x.revenue),num(x.qty)+' porsi terjual')}${stat('Laba kotor',fmt(x.gross),'Penjualan dikurangi HPP')}${stat('Laba / rugi bersih',fmt(x.net),'Setelah seluruh biaya operasional')}</div><div class="grid two"><div class="card"><div class="sectionhead"><h2>Laporan laba rugi</h2><small>${reportMonth}</small></div>${[['Penjualan bersih',x.revenue],['Harga pokok penjualan (HPP)',-x.cogs],['Laba kotor',x.gross],['Biaya tetap bulanan',-x.f],['Pengeluaran tambahan',-x.other],['Laba / rugi bersih',x.net]].map(([a,b],i)=>`<div class="hrow"><span style="${i===5?'font-weight:800;color:var(--ink)':''}">${a}</span><strong style="${b<0?'color:#b4514e':''}">${fmt(b)}</strong></div>`).join('')}<div class="pill mt">Margin bersih: <strong>${x.revenue?pct(x.net/x.revenue*100):'—'}</strong> · Food cost teoretis: <strong>${x.revenue?pct(x.foodCogs/x.revenue*100):'—'}</strong></div></div><div class="card"><div class="sectionhead"><h2>Komposisi biaya</h2></div>${x.revenue?`<div class="barchart">${[['HPP',x.cogs],['Biaya tetap',x.f],['Biaya tambahan',x.other],['Laba bersih',Math.max(0,x.net)]].map(([a,b])=>`<div class="barrow"><span>${a}</span><div class="bartrack"><div class="barfill" style="width:${Math.min(100,Math.max(0,b/x.revenue*100))}%"></div></div><strong class="right">${pct(b/x.revenue*100)}</strong></div>`).join('')}</div>`:`<div class="empty"><strong>Belum ada penjualan</strong>Catat transaksi pada tab Penjualan untuk melihat realisasi omzet dan laba.</div>`}<div class="notice mt">Laba rugi memakai harga dan HPP yang tersimpan pada saat transaksi dicatat. Food cost teoretis dihitung dari resep, bukan stok fisik. Transaksi lama sebelum pembaruan mungkin memasukkan biaya kemasan ke food cost. Laporan operasional ini belum meliputi pajak, penyusutan, retur, stok fisik dan piutang.</div></div>`:reportView==='sales'?`<div class="card"><div class="sectionhead"><h2>Riwayat penjualan</h2><button class="button small" onclick="salesModal()">+ Transaksi</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Menu</th><th>Jumlah</th><th>Harga / porsi</th><th>Total omzet</th><th>Aksi</th></tr></thead><tbody>${x.sales.slice().reverse().map(s=>`<tr><td>${datefmt(s.date)}</td><td><strong>${safe(s.menuName)}</strong></td><td>${num(s.qty)}</td><td>${fmt(s.price)}</td><td><strong>${fmt(n(s.qty)*n(s.price))}</strong></td><td><button class="mini clear" onclick="delSale('${s.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">Belum ada transaksi bulan ini.</div></td></tr>`}</tbody></table></div></div>`:`<div class="card"><div class="sectionhead"><h2>Pengeluaran tambahan</h2><button class="button small" onclick="expenseModal()">+ Pengeluaran</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${x.extra.slice().reverse().map(e=>`<tr><td>${datefmt(e.date)}</td><td>${safe(e.name)}</td><td><strong>${fmt(e.amount)}</strong></td><td><button class="mini clear" onclick="delExpense('${e.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">Belum ada pengeluaran tambahan.</div></td></tr>`}</tbody></table></div><div class="hint mt">Biaya tetap bulan ini: ${fmt(x.f)}. Pengeluaran tambahan hanya untuk biaya di luar daftar pengeluaran tetap.</div></div>`}</div>`}

let toastTimer=null, pendingConfirm=null;
function notify(message,type='ok'){
  const el=document.getElementById('appToast');
  if(!el)return;
  window.clearTimeout(toastTimer);
  el.textContent=String(message);
  el.classList.toggle('error',type==='error');
  el.hidden=false;
  toastTimer=window.setTimeout(()=>{el.hidden=true},3900);
}
function confirmAction(message,callback){
  pendingConfirm=callback;
  openModal(`<h2>Konfirmasi</h2><p class="confirmation-text">${safe(message)}</p><div class="buttons"><button type="button" class="button ghost" onclick="closeModal()">Batal</button><button type="button" class="button danger-action" onclick="runConfirmed()">Ya, lanjutkan</button></div>`);
}
function runConfirmed(){
  const action=pendingConfirm;
  closeModal();
  if(typeof action==='function')action();
}
// Browser validation can block onsubmit without explaining why. Show the missing field explicitly.
document.addEventListener('invalid',event=>{
  const field=event.target;
  const label=field.closest('label');
  const name=label?.childNodes[0]?.textContent?.trim()||field.getAttribute('aria-label')||'yang diperlukan';
  notify('Periksa kolom '+name+'. '+(field.validationMessage||'Isi data dengan benar.'),'error');
},true);

function ingredientModal(key){let i=byid('ingredients',key)||{};openModal(`<h2>${key?'Edit':'Tambah'} bahan</h2><form onsubmit="saveIngredient(event,'${key||''}')" class="formgrid" id="ingredientForm"><label class="span2">Nama bahan<input name="name" required maxlength="90" placeholder="Contoh: Susu full cream" value="${safe(i.name||'')}" /></label><label>Kategori<select name="category"><option ${i.category==='Makanan'?'selected':''}>Makanan</option><option ${i.category==='Minuman'?'selected':''}>Minuman</option><option ${i.category==='Lainnya'?'selected':''}>Lainnya</option></select></label><label>Satuan terkecil<select name="unit"><option value="gr" ${i.unit==='gr'?'selected':''}>Gram (gr)</option><option value="ml" ${i.unit==='ml'?'selected':''}>Mililiter (ml)</option><option value="pcs" ${i.unit==='pcs'?'selected':''}>Buah / pcs</option></select></label><label>Isi per kemasan<input type="number" step="0.001" min="0.001" required name="packSize" value="${i.packSize??''}" placeholder="Contoh: 1000" /></label><label>Harga per kemasan (Rp)<input type="number" min="0" step="1" required name="packPrice" value="${i.packPrice??''}" placeholder="Contoh: 24000" /></label><div class="span2 live-unit" id="unitPreview" aria-live="polite"></div><div class="span2 hint">Masukkan ukuran kemasan dalam satuan terkecil: 1 kg = 1000 gr; 1 liter = 1000 ml. Biaya per satuan dihitung otomatis.</div>${footer()}</form>`)}

function menuModal(key){if(!db.ingredients.length){go('ingredients');notify('Tambahkan bahan terlebih dahulu, lalu kembali buat menu.','error');return}let m=byid('menus',key)||{items:[],category:'Makanan',margin:db.settings.margin,marginCustom:false};let recipe=(m.items.length?m.items:[{ingredientId:'',quantity:1}]).map(x=>recipeRow(x)).join('');openModal(`<h2>${key?'Edit resep & harga':'Tambah menu baru'}</h2><form onsubmit="saveMenu(event,'${key||''}')" class="formgrid" id="menuForm"><label class="span2">Nama menu<input name="name" required maxlength="100" placeholder="Contoh: Iced Cafe Latte" value="${safe(m.name||'')}" /></label><label>Kategori<select name="category"><option ${m.category==='Makanan'?'selected':''}>Makanan</option><option ${m.category==='Minuman'?'selected':''}>Minuman</option></select></label><label>Target margin kotor (%)<input type="number" min="0" max="95" step="0.1" name="margin" required value="${m.marginCustom===true?m.margin:db.settings.margin}" /></label><div class="span2"><div class="sectionhead"><strong style="font-size:12px">Komposisi bahan per porsi</strong><button type="button" class="button alt small" onclick="addRecipe()">+ Bahan</button></div><div id="recipeRows">${recipe}</div></div><label>Biaya tambahan per porsi (Rp)<input name="extraCost" min="0" type="number" value="${m.extraCost??0}" required placeholder="Kemasan, dll" /></label><label>Harga jual manual (Rp)<input name="sellPrice" type="number" min="0" value="${m.sellPrice??0}" required/><small style="font-weight:400;color:#8b9a8e">Isi 0 untuk gunakan rekomendasi otomatis.</small></label><div class="span2 live-price" id="calcPreview" aria-live="polite"></div><div class="span2 hint">Rekomendasi berusaha memenuhi margin minimal dan food cost dalam rentang ${foodRange()}. Harga manual bisa lebih tinggi, tetapi food cost dapat turun di bawah 28%. Biaya tetap dianalisis pada Laba Rugi.</div>${footer()}</form>`)}
function recipeRow(x={}){return `<div class="recipe"><label>Bahan<select class="ingredient-select" required><option value="">Pilih bahan</option>${db.ingredients.map(i=>`<option value="${i.id}" ${i.id===x.ingredientId?'selected':''}>${safe(i.name)} (${i.unit})</option>`).join('')}</select></label><label>Jumlah<input class="quantity" required type="number" min="0.001" step="0.001" value="${x.quantity||1}"/></label><button type="button" class="mini" style="height:40px" onclick="this.parentElement.remove();updateMenuPreview()">×</button></div>`}function addRecipe(){document.getElementById('recipeRows').insertAdjacentHTML('beforeend',recipeRow());updateMenuPreview()}
function saveMenu(e,key){e.preventDefault();let f=e.target;let items=[...f.querySelectorAll('.recipe')].map(r=>({ingredientId:r.querySelector('select').value,quantity:n(r.querySelector('input').value)}));if(!items.length||items.some(x=>!x.ingredientId||!x.quantity))return notify('Pilih minimal satu bahan dan isi jumlah yang lebih besar dari 0.','error');let o=Object.fromEntries(new FormData(f));let m={id:key||id(),name:o.name.trim(),category:o.category,margin:n(o.margin),marginCustom:Math.abs(n(o.margin)-n(db.settings.margin))>1e-9,extraCost:n(o.extraCost),sellPrice:n(o.sellPrice),items};if(key)Object.assign(byid('menus',key),m);else db.menus.push(m);persist();closeModal();render();notify(key?'Menu berhasil diperbarui.':'Menu berhasil ditambahkan.')}

function menuDetail(key){let m=byid('menus',key),x=calcMenu(m);openModal(`<h2>${safe(m.name)}</h2><div class="hrow"><span>Biaya bahan baku</span><strong>${fmt(x.base)}</strong></div><div class="hrow"><span>Cadangan waste (${pct(db.settings.waste)})</span><strong>${fmt(x.waste)}</strong></div><div class="hrow"><span>Food cost bahan per porsi</span><strong>${fmt(x.foodCost)}</strong></div><div class="hrow"><span>Biaya variabel tambahan / kemasan</span><strong>${fmt(x.other)}</strong></div><div class="hrow"><span>Total HPP variabel per porsi</span><strong>${fmt(x.hpp)}</strong></div><div class="divider"></div><div class="hrow"><span>Harga minimal (food cost ≤ ${pct(db.settings.foodMax)})</span><strong>${fmt(x.pFood)}</strong></div><div class="hrow"><span>Harga maksimal (food cost ≥ ${pct(db.settings.foodMin)})</span><strong>${fmt(x.pFoodUpper)}</strong></div><div class="hrow"><span>Harga minimal (target margin ${pct(x.margin)})</span><strong>${fmt(x.pMargin)}</strong></div><div class="hrow"><span>Harga jual rekomendasi</span><strong class="price">${fmt(x.recommended)}</strong></div><div class="hrow"><span>Harga jual yang digunakan</span><strong>${fmt(x.actual)}</strong></div><div class="hrow"><span>Food cost terhadap harga jual</span><strong>${pct(x.food)}</strong></div><div class="hrow"><span>Margin kotor estimasi (sebelum overhead)</span><strong>${fmt(x.profit)} (${pct(x.profitPct)})</strong></div><div class="pill mt">Food cost ${foodRange()}: <strong>${x.foodPass?'Sesuai':'Di luar rentang'}</strong> · Margin ≥ ${pct(x.margin)}: <strong>${x.marginPass?'Sesuai':'Belum sesuai'}</strong></div><div class="hint mt">${pricingNote(x)}</div><div class="hint mt">Margin = (harga jual − HPP variabel) ÷ harga jual × 100%. Margin ini masih perlu menutup gaji, listrik, air, sewa, pajak, dan biaya operasional lainnya. Laba bersih dihitung pada tab Laba Rugi.</div><div class="buttons"><button class="button ghost" onclick="closeModal()">Tutup</button><button class="button" onclick="closeModal();menuModal('${m.id}')">Ubah menu</button></div>`)}
function saveSettings(e){
 e.preventDefault();let d=Object.fromEntries(new FormData(e.target));
 let lo=n(d.foodMin),hi=n(d.foodMax),margin=n(d.margin);
 if(lo<=0||hi>=100||lo>=hi){notify('Food cost minimum harus lebih kecil dari maksimum; keduanya antara 0–100%.','error');return}
 if(margin<0||margin>=100){notify('Margin harus antara 0% sampai kurang dari 100%.','error');return}
 for(let k of ['foodMin','foodMax','margin','waste','forecastPortions'])db.settings[k]=n(d[k]);
 db.settings.foodTarget=hi;
 persist();render();notify('Pengaturan berhasil disimpan.');
}
function fixedModal(idx){let a=db.settings.fixed[idx]||{};openModal(`<h2>${Number.isInteger(idx)?'Edit':'Tambah'} biaya tetap</h2><form class="formgrid" onsubmit="saveFixed(event,${idx??-1})"><label class="span2">Nama pengeluaran<input required maxlength="90" name="name" value="${safe(a.name||'')}" placeholder="Contoh: Sewa tempat"/></label><label class="span2">Nominal per bulan (Rp)<input required min="0" type="number" name="value" value="${a.value??''}"/></label>${footer()}</form>`)}function saveFixed(e,idx){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let o={name:v.name.trim(),value:n(v.value)};if(idx>=0)db.settings.fixed[idx]=o;else db.settings.fixed.push(o);persist();closeModal();render();notify(idx>=0?'Pengeluaran tetap diperbarui.':'Pengeluaran tetap ditambahkan.')}function delFixed(idx){confirmAction('Hapus pengeluaran tetap ini?',()=>{db.settings.fixed.splice(idx,1);persist();render();notify('Pengeluaran tetap dihapus.')})}
function salesModal(){if(!db.menus.length){go('menus');notify('Buat menu terlebih dahulu sebelum mencatat penjualan.','error');return}openModal(`<h2>Catat penjualan</h2><form class="formgrid" onsubmit="saveSale(event)"><label class="span2">Menu<select name="menuId" required>${db.menus.map(m=>`<option value="${m.id}">${safe(m.name)} — ${fmt(calcMenu(m).actual)}</option>`).join('')}</select></label><label>Tanggal<input type="date" required name="date" value="${new Date().toLocaleDateString('en-CA')}" /></label><label>Jumlah porsi<input type="number" required min="1" step="1" name="qty" value="1"/></label><div class="hint span2">Harga jual dan HPP disalin dari menu saat transaksi dicatat. Bila harga berubah di kemudian hari, transaksi lama tidak ikut berubah.</div>${footer('Catat penjualan')}</form>`)}function saveSale(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),m=byid('menus',d.menuId),x=calcMenu(m);db.sales.push({id:id(),date:d.date,menuId:m.id,menuName:m.name,qty:n(d.qty),price:x.actual,cost:x.hpp,foodCost:x.foodCost});persist();closeModal();reportMonth=d.date.slice(0,7);reportView='sales';tab='reports';render();notify('Penjualan berhasil dicatat.');};function delSale(key){confirmAction('Hapus transaksi penjualan ini?',()=>{db.sales=db.sales.filter(s=>s.id!==key);persist();render();notify('Transaksi penjualan dihapus.')})}
function expenseModal(){openModal(`<h2>Catat pengeluaran tambahan</h2><form class="formgrid" onsubmit="saveExpense(event)"><label class="span2">Keterangan<input required maxlength="100" name="name" placeholder="Contoh: Perbaikan mesin kopi"/></label><label>Tanggal<input required type="date" name="date" value="${new Date().toLocaleDateString('en-CA')}"/></label><label>Jumlah (Rp)<input required min="0" type="number" name="amount"/></label><div class="span2 hint">Hanya biaya di luar pengeluaran tetap dan HPP bahan. Hindari pencatatan ganda.</div>${footer()}</form>`)}function saveExpense(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.expenses.push({id:id(),name:o.name.trim(),date:o.date,amount:n(o.amount)});persist();closeModal();reportMonth=o.date.slice(0,7);reportView='expenses';tab='reports';render();notify('Pengeluaran berhasil dicatat.')}function delExpense(key){confirmAction('Hapus pengeluaran tambahan ini?',()=>{db.expenses=db.expenses.filter(e=>e.id!==key);persist();render();notify('Pengeluaran tambahan dihapus.')})}
function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();notify('File '+name+' disiapkan untuk diunduh.');setTimeout(()=>URL.revokeObjectURL(url),10000)}function backup(){download(JSON.stringify(db,null,2),'ruanghpp-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json')};function restore(e){
 let file=e.target.files?.[0];if(!file)return;
 e.target.value='';
 let r=new FileReader();
 r.onerror=()=>notify('Gagal membaca file cadangan.','error');
 r.onload=()=>{try{
   let x=JSON.parse(r.result);
   if(!Array.isArray(x.ingredients)||!Array.isArray(x.menus)||!Array.isArray(x.sales)||!Array.isArray(x.expenses)||!x.settings||!Array.isArray(x.settings.fixed))throw Error('Format file tidak cocok');
   confirmAction('Pulihkan backup? Seluruh data saat ini akan diganti dengan isi file cadangan.',()=>{
     db={...fresh(),...x,settings:{...fresh().settings,...x.settings}};
     migratePricing(db);
     persist();render();notify('Backup berhasil dipulihkan.');
   });
 }catch(err){notify('Gagal memulihkan backup: '+err.message,'error')}};
 r.readAsText(file);
}

function exportReportCSV(){
 const f=financials();
 let rows=[['RUANG HPP — LAPORAN LABA RUGI',reportMonth],['Komponen','Jumlah (Rp)'],
  ['Penjualan',f.revenue],['HPP penjualan',-f.cogs],['Laba kotor',f.gross],
  ['Anggaran pengeluaran tetap',-f.f],['Pengeluaran tambahan',-f.other],['Estimasi laba rugi',f.net],[],
  ['DAFTAR PENJUALAN'],['Tanggal','Menu','Jumlah','Harga satuan','Omzet'],
  ...f.sales.map(s=>[s.date,s.menuName,s.qty,s.price,n(s.qty)*n(s.price)]),[],
  ['PENGELUARAN TAMBAHAN'],['Tanggal','Keterangan','Nominal'],
  ...f.extra.map(e=>[e.date,e.name,e.amount])];
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');
 download(csv,'ruanghpp-laporan-'+reportMonth+'.csv','text/csv;charset=utf-8');
}

function exportCSV(){let rows=[['Menu','Kategori','Biaya bahan + waste','HPP variabel','Harga dari food cost','Harga dari margin','Harga rekomendasi','Harga jual','Food cost %','Margin kontribusi estimasi %','Margin kontribusi per porsi','Status dua target'],...db.menus.map(m=>{let x=calcMenu(m);return [m.name,m.category,x.foodCost,x.hpp,x.pFood,x.pMargin,x.recommended,x.actual,x.food,x.profitPct,x.profit,x.status]})];download('\ufeff'+rows.map(r=>r.map(s=>'"'+String(s).replaceAll('"','""')+'"').join(';')).join('\n'),'ruanghpp-menu.csv','text/csv;charset=utf-8')}

const phoneStat=(name,value,note='')=>`<div class="phone-stat"><span>${name}</span><strong>${value}</strong>${note?`<small>${note}</small>`:''}</div>`;

function phoneIngredientPage(){

function phoneIngredientCards(list){
 if(!list.length)return emptyPhone(db.ingredients.length?'Tidak ditemukan':'Belum ada bahan',db.ingredients.length?'Coba kata kunci yang berbeda.':'Tambahkan bahan pertama untuk mulai menghitung HPP menu.');
 return `<div class="phone-list">${list.map(i=>`<article class="phone-card">
  <div class="phone-card-head"><div class="minw"><span class="item-type">${safe(i.category)}</span><h3>${safe(i.name)}</h3></div><div class="unit-badge">${safe(i.unit)}</div></div>
  <div class="price-block"><small>Harga per ${safe(i.unit)}</small><strong>${fmt(ingCost(i))}<span> / ${safe(i.unit)}</span></strong></div>

  <div class="phone-actions"><button type="button" onclick="ingredientModal('${i.id}')">Edit bahan</button><button type="button" class="action-delete" onclick="delIngredient('${i.id}')" aria-label="Hapus bahan ${safe(i.name)}">Hapus</button></div>
 </article>`).join('')}</div>`;
}
function phoneMenuPage(){

 <section class="phone-callout"><div class="callout-accent"></div><div><small>KALKULASI HARGA JUAL</small><h2>Harga jual tetap kamu yang tentukan.</h2><p>Harga rekomendasi merupakan acuan minimum biaya; harga manual boleh lebih tinggi.</p></div></section>
 <div class="phone-stats">${phoneStat('Total menu',num(db.menus.length),'Resep tersimpan')}${phoneStat('Sesuai target',num(db.menus.filter(m=>calcMenu(m).pass).length),'FC '+foodRange()+' & margin '+pct(db.settings.margin))}</div>
 <div class="phone-section-label"><h2>Daftar menu</h2><span>${db.menus.length} item</span></div>

   return `<article class="phone-card menu-phone-card">
    <div class="phone-card-head"><div class="minw"><span class="item-type">${safe(m.category)}</span><h3>${safe(m.name)}</h3></div><span class="status-pill ${x.pass?'status-ok':x.food<x.minFC?'status-warn':'status-alert'}">${x.pass?'Sesuai target':safe(x.status)}</span></div>

    <p class="recommended-line">Rekomendasi harga minimum <b>${fmt(x.recommended)}</b></p>${!x.canMatch||!x.recommendInRange?`<p class="form-help">${pricingNote(x)}</p>`:''}
    <div class="phone-actions"><button type="button" onclick="menuDetail('${m.id}')">Lihat rincian</button><button type="button" onclick="menuModal('${m.id}')">Edit</button><button type="button" class="action-delete" onclick="delMenu('${m.id}')" aria-label="Hapus ${safe(m.name)}">Hapus</button></div>

 <div class="phone-subtle"><strong>Target food cost ${foodRange()} • Margin ≥ ${pct(db.settings.margin)}</strong><p>Food cost = (bahan + waste) ÷ harga jual. Margin kontribusi* = (harga jual − seluruh biaya variabel) ÷ harga jual. Margin 70% berarti food cost sekitar 30% bila tak ada biaya tambahan. Belum dikurangi biaya tetap.</p></div>

 return `<div class="phone-stack">
 <div class="phone-stats">${phoneStat('Biaya tetap / bulan',fmt(fixed()),'Estimasi pengeluaran')}${phoneStat('Rentang food cost',foodRange(),'Target bahan / penjualan')}</div>

  <form class="formgrid" onsubmit="saveSettings(event)">
   <label>Food cost minimum (%)<input type="number" inputmode="decimal" min="0.1" max="99" step="0.1" name="foodMin" required value="${db.settings.foodMin}"></label>
   <label>Food cost maksimum (%)<input type="number" inputmode="decimal" min="0.1" max="99" step="0.1" name="foodMax" required value="${db.settings.foodMax}"></label>
   <label>Target margin kontribusi (%)<input type="number" inputmode="decimal" min="0" max="95" step="0.1" name="margin" required value="${db.settings.margin}"></label>

   <p class="form-help span2">Margin 70% adalah margin kontribusi sebelum biaya tetap, bukan laba bersih. Target food cost 28–35% dan margin 70% dapat bertentangan bila ada biaya kemasan/tambahan. Waste boleh 0%; proyeksi porsi tidak menentukan harga jual.</p>
   <button class="button span2 primary-full" type="submit">Simpan pengaturan</button>
  </form>
 </section>
 <section class="phone-card settings-card"><div class="phone-section-label inset"><h2>Pengeluaran rutin</h2><button type="button" class="text-button" onclick="fixedModal()">+ Tambah</button></div>
 <div class="settings-expenses">${db.settings.fixed.map((e,i)=>`<div class="expense-row"><div class="minw"><strong>${safe(e.name)}</strong><span>${fmt(e.value)} / bulan</span></div><button type="button" onclick="fixedModal(${i})" aria-label="Edit ${safe(e.name)}">Edit</button><button type="button" class="del-plain" onclick="delFixed(${i})" aria-label="Hapus ${safe(e.name)}">×</button></div>`).join('')||`<p class="form-help">Belum ada pengeluaran rutin.</p>`}</div>

 <section class="phone-card settings-card"><div class="phone-section-label inset"><h2>Cadangan data</h2></div><div class="backup-actions"><button type="button" class="button alt" onclick="backup()">Unduh backup JSON</button><button type="button" class="button ghost" onclick="document.getElementById('restoreFile').click()">Pulihkan data</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restore(event)"><button type="button" class="button ghost" onclick="exportCSV()">Ekspor menu CSV</button></div><p class="form-help">Data tersimpan pada browser perangkat ini. Simpan backup secara berkala.</p></section>

function phoneReportPage(){
 const x=financials(); const hasActivity=x.sales.length>0||x.extra.length>0;

 ${reportView==='overview'?`

function updatePricePreview(){
 const f=document.getElementById('ingredientForm'),out=document.getElementById('unitPreview');if(!f||!out)return;
 const size=n(f.elements.packSize.value),price=n(f.elements.packPrice.value),unit=f.elements.unit.value;
 out.innerHTML=`<small>Estimasi harga per ${unit}</small><strong>${size>0?('Rp '+(price/size).toLocaleString('id-ID',{maximumFractionDigits:3})):'—'} <em>/ ${unit}</em></strong>`;
}
function updateMenuPreview(){
 const f=document.getElementById('menuForm'),out=document.getElementById('calcPreview');if(!f||!out)return;
 const items=[...f.querySelectorAll('.recipe')].map(r=>({ingredientId:r.querySelector('select').value,quantity:n(r.querySelector('input').value)}));
 const valid=items.length>0&&items.every(i=>i.ingredientId&&i.quantity>0);
 if(!valid){out.innerHTML='<small>Pratinjau harga jual</small><p>Pilih bahan dan isi jumlah per porsi untuk melihat rekomendasi.</p>';return}
 const val=calcMenu({items,margin:n(f.elements.margin.value),marginCustom:true,extraCost:n(f.elements.extraCost.value),sellPrice:n(f.elements.sellPrice.value)});
 out.innerHTML=`<small>REKOMENDASI HARGA JUAL</small><strong>${fmt(val.recommended)}</strong><div class="live-price-foot"><span>HPP ${fmt(val.hpp)}</span><span>Food cost ${pct(val.food)}</span><span>Margin ${pct(val.profitPct)}</span></div><p>${n(f.elements.sellPrice.value)>0?'Food cost & margin mengikuti harga jual manual. ':'Harga rekomendasi mengikuti margin dan batas atas food cost. '}${val.status}. ${!val.canMatch||!val.recommendInRange?pricingNote(val):''}</p>`;
}
let wasPhone=isPhone();window.addEventListener('resize',()=>{const phone=isPhone();if(phone!==wasPhone){wasPhone=phone;render();}});

render();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
